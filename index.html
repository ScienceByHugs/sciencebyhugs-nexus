<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <meta name="description" content="Customer-facing ordering and account PWA for the Science By HUGs ecosystem." />
    <title>Science By HUGs Nexus</title>
    <style>
      html,body{margin:0;min-height:100%;background:#050816;color:#f7faff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #bootFallback{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
      #bootFallback>div{max-width:360px;padding:24px;border:1px solid rgba(127,219,255,.18);border-radius:20px;background:#080e1b}
      #bootFallback strong{display:block;font-size:1.1rem;margin-bottom:8px}
      #bootFallback p{margin:0 0 16px;color:#9fb0c8;line-height:1.5;font-size:.85rem}
      #bootFallback button{min-height:44px;padding:0 16px;border:1px solid rgba(127,219,255,.28);border-radius:12px;background:#0b1020;color:#fff;font-weight:800}
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bootFallback">
        <div>
          <strong>Opening Nexus…</strong>
          <p>If Nexus does not load, refresh once. The app will recover automatically after the latest deployment finishes propagating.</p>
          <button type="button" onclick="location.reload()">Reload Nexus</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
