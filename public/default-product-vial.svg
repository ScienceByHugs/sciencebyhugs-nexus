  <path d="M246 238h208c27 0 49 22 49 49v248c0 48-39 87-87 87H284c-48 0-87-39-87-87V287c0-27 22-49 49-49z" fill="url(#glass)" stroke="#d8e5f3" stroke-width="5"/>
  <path d="M218 492h264v63c0 34-28 62-62 62H280c-34 0-62-28-62-62z" fill="#eef5fc" opacity=".56"/>
