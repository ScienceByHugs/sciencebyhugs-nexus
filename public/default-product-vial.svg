<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="t d">
<title id="t">Science By HUGs research vial</title>
<desc id="d">A clean blue and silver research peptide vial used as the default Nexus product image.</desc>
<defs>
  <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#f7fbff" stop-opacity=".96"/><stop offset=".5" stop-color="#c8d8ea" stop-opacity=".38"/><stop offset="1" stop-color="#f7fbff" stop-opacity=".9"/></linearGradient>
  <linearGradient id="cap" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2f80ed"/><stop offset=".5" stop-color="#1363df"/><stop offset="1" stop-color="#071d4d"/></linearGradient>
  <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset=".35" stop-color="#9fb1c6"/><stop offset=".7" stop-color="#e9f0f7"/><stop offset="1" stop-color="#6b7a8e"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#7fdbff"/><stop offset=".5" stop-color="#2f80ed"/><stop offset="1" stop-color="#1363df"/></linearGradient>
